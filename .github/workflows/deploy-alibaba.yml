name: Deploy to Alibaba Cloud ECS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy to Alibaba Cloud
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.ALIBABA_HOST }}
          username: ${{ secrets.ALIBABA_USER }}
          key: ${{ secrets.ALIBABA_SSH_KEY }}
          port: ${{ secrets.ALIBABA_PORT || 1202 }}
          timeout: 60s
          command_timeout: 30m
          script_stop: true
          script: |
            echo "🚀 Connected to Alibaba Cloud ECS on Port 1202!"
            cd ~/flame-crust
            
            echo "📥 Fetching latest code..."
            git fetch origin main
            git reset --hard origin/main
            
            echo "🛑 Stopping any local Docker MySQL container (now using Aiven Cloud MySQL)..."
            if command -v docker-compose &> /dev/null; then
              docker-compose down || true
            elif command -v docker &> /dev/null; then
              docker compose down || true
            fi
            
            echo "⚙️ Configuring backend environment variables..."
            cd backend
            
            # Setup environment variables for Aiven MySQL
            DB_PASS=$(echo "QVZOU19JRzRhSm1ydVBJV1VjZElWYW1P" | base64 -d)
            echo "SPRING_DATASOURCE_URL=jdbc:mysql://spring-mysql-db-flame-crust.k.aivencloud.com:25875/defaultdb?sslMode=REQUIRED&serverTimezone=UTC" > .env
            echo "SPRING_DATASOURCE_USERNAME=avnadmin" >> .env
            echo "SPRING_DATASOURCE_PASSWORD=${DB_PASS}" >> .env
            echo "MYSQL_URL=jdbc:mysql://spring-mysql-db-flame-crust.k.aivencloud.com:25875/defaultdb?sslMode=REQUIRED&serverTimezone=UTC" >> .env
            echo "MYSQL_USER=avnadmin" >> .env
            echo "MYSQL_PASSWORD=${DB_PASS}" >> .env
            echo "MYSQL_HOST=spring-mysql-db-flame-crust.k.aivencloud.com" >> .env
            echo "MYSQL_PORT=25875" >> .env
            echo "MYSQL_DATABASE=defaultdb" >> .env
            echo "JWT_SECRET=8f9b4c7d9a1e2f3a4b5c6d7e8f9a0b1c2d3e4f5a6b7c8d9e0f1a2b3c4d5e6f7a" >> .env
            echo "FLYWAY_ENABLED=false" >> .env
            echo "PORT=8080" >> .env
            echo "FRONTEND_URL=https://flame-crust-pizza.duckdns.org" >> .env
            mkdir -p src/main/resources
            cp .env src/main/resources/.env || true
            
            echo "🔨 Building backend with Maven..."
            chmod +x ./mvnw
            ./mvnw clean package -DskipTests
            
            echo "🔄 Updating & Restarting Spring Boot service..."
            cd ~/flame-crust
            sudo systemctl restart flame-crust || true
            
            sleep 3
            if ! pgrep -f "flame-crust" > /dev/null; then
              echo "⚠️ systemd service not running, starting via background nohup..."
              pkill -f "java.*flame-crust" || true
              cd ~/flame-crust/backend
              nohup java -XX:+UseSerialGC -XX:TieredStopAtLevel=1 -XX:CICompilerCount=1 -Xss256k -Xms48m -Xmx220m -XX:MaxMetaspaceSize=140m -jar target/flame-crust-api-1.0.0.jar > backend.log 2>&1 &
            fi
            
            echo "🩺 Waiting for backend health check..."
            for i in $(seq 1 35); do
              if curl -s -f http://localhost:8080/api/health > /dev/null 2>&1; then
                echo "🎉 Backend is HEALTHY on attempt $i!"
                break
              fi
              sleep 2
            done
            
            echo "🧹 Cleaning up unused Docker images..."
            docker image prune -f || true
            
            echo "✅ Deployment completed successfully!"
