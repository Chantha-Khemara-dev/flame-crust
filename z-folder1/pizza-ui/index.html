<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pizza Animations - UI Test</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #ff6b6b;
            --primary-dark: #ee5253;
            --dark: #2d3436;
            --light: #f9f9f9;
            --glass-bg: rgba(255, 255, 255, 0.85);
            --shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
            --shadow-hover: 0 20px 50px rgba(0, 0, 0, 0.15);
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background-color: #f1f2f6;
            color: var(--dark);
            overflow-x: hidden;
        }

        /* --- Navbar --- */
        nav {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            padding: 20px 50px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 1000;
            transition: var(--transition);
            background: transparent;
        }

        nav.scrolled {
            background: var(--glass-bg);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            box-shadow: 0 2px 20px rgba(0, 0, 0, 0.05);
            padding: 15px 50px;
        }

        .logo {
            font-size: 28px;
            font-weight: 800;
            color: var(--primary);
            letter-spacing: -1px;
        }

        .nav-links {
            display: flex;
            gap: 30px;
            align-items: center;
        }

        .nav-links a {
            text-decoration: none;
            color: var(--dark);
            font-weight: 500;
            position: relative;
        }

        .nav-links a::after {
            content: '';
            position: absolute;
            bottom: -5px;
            left: 0;
            width: 0;
            height: 2px;
            background: var(--primary);
            transition: width 0.3s ease;
        }

        .nav-links a:hover::after {
            width: 100%;
        }

        .cart-icon {
            position: relative;
            cursor: pointer;
            font-size: 20px;
            background: transparent;
            border: none;
            color: var(--dark);
        }

        .cart-badge {
            position: absolute;
            top: -10px;
            right: -10px;
            background: var(--primary);
            color: white;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 12px;
            font-weight: 600;
            opacity: 0;
            transform: scale(0);
            transition: var(--transition);
        }

        .cart-badge.active {
            opacity: 1;
            transform: scale(1);
        }

        /* Bounce Animation for Cart Icon */
        @keyframes bounceShake {
            0%, 100% { transform: translateY(0) rotate(0); }
            25% { transform: translateY(-8px) rotate(-10deg); }
            50% { transform: translateY(0) rotate(10deg); }
            75% { transform: translateY(-4px) rotate(-5deg); }
        }

        .cart-icon.bounce {
            animation: bounceShake 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        /* --- Hero Section --- */
        .hero {
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            background: linear-gradient(rgba(0,0,0,0.4), rgba(0,0,0,0.6)), url('https://images.unsplash.com/photo-1513104890138-7c749659a591?auto=format&fit=crop&w=1920&q=80') no-repeat center center/cover;
            color: white;
            padding: 0 20px;
        }

        .hero h1 {
            font-size: 5rem;
            font-weight: 800;
            margin-bottom: 20px;
            text-shadow: 0 10px 30px rgba(0,0,0,0.3);
            opacity: 0;
            transform: translateY(40px);
            animation: fadeUp 1s 0.2s forwards cubic-bezier(0.16, 1, 0.3, 1);
        }

        .hero p {
            font-size: 1.2rem;
            margin-bottom: 40px;
            opacity: 0;
            transform: translateY(40px);
            animation: fadeUp 1s 0.5s forwards cubic-bezier(0.16, 1, 0.3, 1);
        }

        .hero-btns {
            display: flex;
            gap: 20px;
            opacity: 0;
            transform: translateY(40px);
            animation: fadeUp 1s 0.8s forwards cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes fadeUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .btn {
            padding: 15px 40px;
            border-radius: 50px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            border: none;
            transition: var(--transition);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
            box-shadow: 0 10px 20px rgba(255, 107, 107, 0.4);
        }

        .btn-primary:hover {
            background: var(--primary-dark);
            transform: translateY(-3px);
            box-shadow: 0 15px 30px rgba(255, 107, 107, 0.5);
        }

        .btn-outline {
            background: transparent;
            border: 2px solid white;
            color: white;
        }

        .btn-outline:hover {
            background: white;
            color: var(--dark);
            transform: translateY(-3px);
        }

        /* --- Menu Section --- */
        .menu-section {
            padding: 100px 50px;
            background: #fff;
        }

        .section-header {
            text-align: center;
            margin-bottom: 60px;
        }

        .section-header h2 {
            font-size: 3rem;
            color: var(--dark);
            margin-bottom: 10px;
        }

        .section-header p {
            color: #777;
            font-size: 1.1rem;
        }

        .pizza-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 40px;
            max-width: 1200px;
            margin: 0 auto;
        }

        /* --- Pizza Card --- */
        .pizza-card {
            background: white;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: var(--shadow);
            transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.4s ease;
        }

        .pizza-card:hover {
            transform: translateY(-15px);
            box-shadow: var(--shadow-hover);
        }

        .pizza-img-wrapper {
            height: 250px;
            width: 100%;
            overflow: hidden;
        }

        .pizza-img-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .pizza-card:hover .pizza-img-wrapper img {
            transform: scale(1.08);
        }

        .pizza-info {
            padding: 25px;
        }

        .pizza-info h3 {
            font-size: 1.5rem;
            margin-bottom: 10px;
        }

        .pizza-info p {
            color: #777;
            font-size: 0.95rem;
            margin-bottom: 20px;
            min-height: 40px;
        }

        .pizza-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .price {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--primary);
        }

        /* --- Add to Cart Button --- */
        .add-btn {
            background: var(--dark);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 50px;
            cursor: pointer;
            font-weight: 600;
            transition: var(--transition);
            position: relative;
            overflow: hidden;
            min-width: 120px;
        }

        .add-btn:hover {
            background: var(--primary);
        }

        .add-btn.added {
            background: #27ae60;
        }

        /* Ripple Effect */
        .ripple {
            position: absolute;
            border-radius: 50%;
            transform: scale(0);
            animation: rippleEffect 0.6s linear;
            background-color: rgba(255, 255, 255, 0.5);
        }

        @keyframes rippleEffect {
            to {
                transform: scale(4);
                opacity: 0;
            }
        }

        /* --- Cart Sidebar --- */
        .cart-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(5px);
            z-index: 1100;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s ease;
        }

        .cart-overlay.open {
            opacity: 1;
            pointer-events: all;
        }

        .cart-sidebar {
            position: fixed;
            top: 0;
            right: 0;
            width: 400px;
            max-width: 100%;
            height: 100%;
            background: white;
            z-index: 1200;
            box-shadow: -5px 0 30px rgba(0,0,0,0.1);
            transform: translateX(100%);
            transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1); /* Highly satisfying ease */
            display: flex;
            flex-direction: column;
        }

        .cart-sidebar.open {
            transform: translateX(0);
        }

        .cart-header {
            padding: 30px;
            border-bottom: 1px solid #eee;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .cart-header h3 {
            font-size: 1.5rem;
        }

        .close-cart {
            background: transparent;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
            color: #777;
            transition: var(--transition);
        }

        .close-cart:hover {
            color: var(--primary);
            transform: rotate(90deg);
        }

        .cart-items {
            flex-grow: 1;
            overflow-y: auto;
            padding: 30px;
        }

        .cart-item {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
            padding-bottom: 20px;
            border-bottom: 1px solid #eee;
            animation: slideInRight 0.5s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes slideInRight {
            from { opacity: 0; transform: translateX(50px); }
            to { opacity: 1; transform: translateX(0); }
        }

        .cart-item img {
            width: 80px;
            height: 80px;
            border-radius: 10px;
            object-fit: cover;
        }

        .item-details {
            flex-grow: 1;
        }

        .item-details h4 {
            margin-bottom: 5px;
        }

        .item-price {
            color: var(--primary);
            font-weight: 600;
        }

        .remove-item {
            background: transparent;
            border: none;
            color: #ccc;
            cursor: pointer;
            transition: var(--transition);
        }

        .remove-item:hover {
            color: var(--primary);
        }

        .cart-footer {
            padding: 30px;
            border-top: 1px solid #eee;
        }

        .cart-total {
            display: flex;
            justify-content: space-between;
            font-size: 1.2rem;
            font-weight: 700;
            margin-bottom: 20px;
        }

        .checkout-btn {
            width: 100%;
            padding: 15px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
        }

        .checkout-btn:hover {
            background: var(--primary-dark);
            transform: scale(1.02);
        }

        .checkout-btn:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }

        .empty-cart {
            text-align: center;
            color: #777;
            margin-top: 50px;
        }

        /* --- Modal --- */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(5px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 2000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .modal-overlay.open {
            opacity: 1;
            pointer-events: all;
        }

        .modal-content {
            background: white;
            padding: 50px;
            border-radius: 20px;
            text-align: center;
            max-width: 400px;
            width: 90%;
            transform: scale(0.8);
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); /* Bouncy spring */
            box-shadow: 0 20px 60px rgba(0,0,0,0.2);
        }

        .modal-overlay.open .modal-content {
            transform: scale(1);
        }

        .check-icon {
            width: 80px;
            height: 80px;
            background: #2ecc71;
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
            margin: 0 auto 20px;
        }

        .modal-content h3 {
            font-size: 1.8rem;
            margin-bottom: 10px;
        }

        .modal-content p {
            color: #777;
            margin-bottom: 30px;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .hero h1 { font-size: 3rem; }
            nav { padding: 20px; }
            nav.scrolled { padding: 15px 20px; }
            .menu-section { padding: 60px 20px; }
        }
    </style>
</head>
<body>

    <!-- Navbar -->
    <nav id="navbar">
        <div class="logo">PizzaDine</div>
        <div class="nav-links">
            <a href="#">Home</a>
            <a href="#">Menu</a>
            <a href="#">About</a>
            <button class="cart-icon" id="cartBtn">
                <i class="fas fa-shopping-cart"></i>
                <span class="cart-badge" id="cartBadge">0</span>
            </button>
        </div>
    </nav>

    <!-- Hero -->
    <section class="hero">
        <h1>Authentic Taste</h1>
        <p>Experience the finest pizzas baked with love and fresh ingredients.</p>
        <div class="hero-btns">
            <button class="btn btn-primary">Order Now</button>
            <button class="btn btn-outline">View Menu</button>
        </div>
    </section>

    <!-- Menu -->
    <section class="menu-section" id="menu">
        <div class="section-header">
            <h2>Our Special Menu</h2>
            <p>Crafted with perfection, just for you.</p>
        </div>
        <div class="pizza-grid" id="pizzaGrid">
            <!-- Dynamic Content -->
        </div>
    </section>

    <!-- Cart Sidebar -->
    <div class="cart-overlay" id="cartOverlay"></div>
    <div class="cart-sidebar" id="cartSidebar">
        <div class="cart-header">
            <h3>Your Cart</h3>
            <button class="close-cart" id="closeCart"><i class="fas fa-times"></i></button>
        </div>
        <div class="cart-items" id="cartItems">
            <!-- Dynamic Cart Items -->
        </div>
        <div class="cart-footer">
            <div class="cart-total">
                <span>Total:</span>
                <span id="cartTotal">$0.00</span>
            </div>
            <button class="checkout-btn" id="checkoutBtn" disabled>Checkout</button>
        </div>
    </div>

    <!-- Checkout Success Modal -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal-content">
            <div class="check-icon"><i class="fas fa-check"></i></div>
            <h3>Order Placed!</h3>
            <p>Thank you for your purchase. Your delicious pizza is on the way!</p>
            <button class="btn btn-primary" id="closeModal">Continue</button>
        </div>
    </div>

    <script>
        // --- Data ---
        const pizzas = [
            {
                id: 1,
                name: "Margherita Classic",
                image: "https://images.unsplash.com/photo-1574071318508-1cdbab80d002?auto=format&fit=crop&w=600&q=80",
                ingredients: "Fresh basil, mozzarella, tomato sauce",
                price: 12.99
            },
            {
                id: 2,
                name: "Pepperoni Feast",
                image: "https://images.unsplash.com/photo-1628840042765-356cda07504e?auto=format&fit=crop&w=600&q=80",
                ingredients: "Double pepperoni, extra cheese, spicy sauce",
                price: 15.50
            },
            {
                id: 3,
                name: "BBQ Chicken Deluxe",
                image: "https://images.unsplash.com/photo-1565299624946-b28f40a0ae38?auto=format&fit=crop&w=600&q=80",
                ingredients: "Grilled chicken, BBQ sauce, red onions, cilantro",
                price: 16.99
            },
            {
                id: 4,
                name: "Veggie Supreme",
                image: "https://images.unsplash.com/photo-1571997478779-2adcbbe9ab2f?auto=format&fit=crop&w=600&q=80",
                ingredients: "Bell peppers, mushrooms, olives, onions",
                price: 14.00
            }
        ];

        let cart = [];

        // --- DOM Elements ---
        const pizzaGrid = document.getElementById('pizzaGrid');
        const cartBtn = document.getElementById('cartBtn');
        const cartSidebar = document.getElementById('cartSidebar');
        const cartOverlay = document.getElementById('cartOverlay');
        const closeCartBtn = document.getElementById('closeCart');
        const cartItemsContainer = document.getElementById('cartItems');
        const cartBadge = document.getElementById('cartBadge');
        const cartTotal = document.getElementById('cartTotal');
        const checkoutBtn = document.getElementById('checkoutBtn');
        const modalOverlay = document.getElementById('modalOverlay');
        const closeModalBtn = document.getElementById('closeModal');

        // --- Render Pizzas ---
        function renderPizzas() {
            pizzaGrid.innerHTML = pizzas.map(pizza => `
                <div class="pizza-card">
                    <div class="pizza-img-wrapper">
                        <img src="${pizza.image}" alt="${pizza.name}">
                    </div>
                    <div class="pizza-info">
                        <h3>${pizza.name}</h3>
                        <p>${pizza.ingredients}</p>
                        <div class="pizza-footer">
                            <span class="price">$${pizza.price.toFixed(2)}</span>
                            <button class="add-btn" data-id="${pizza.id}">Add to Cart</button>
                        </div>
                    </div>
                </div>
            `).join('');

            // Attach event listeners to Add buttons
            document.querySelectorAll('.add-btn').forEach(btn => {
                btn.addEventListener('click', handleAddToCart);
            });
        }

        // --- Ripple Effect ---
        function createRipple(event) {
            const button = event.currentTarget;
            const circle = document.createElement("span");
            const diameter = Math.max(button.clientWidth, button.clientHeight);
            const radius = diameter / 2;

            circle.style.width = circle.style.height = `${diameter}px`;
            circle.style.left = `${event.clientX - button.getBoundingClientRect().left - radius}px`;
            circle.style.top = `${event.clientY - button.getBoundingClientRect().top - radius}px`;
            circle.classList.add("ripple");

            const ripple = button.getElementsByClassName("ripple")[0];
            if (ripple) ripple.remove();
            
            button.appendChild(circle);
        }

        // --- Add to Cart Logic ---
        function handleAddToCart(e) {
            createRipple(e);
            
            const btn = e.currentTarget;
            const id = parseInt(btn.getAttribute('data-id'));
            const pizza = pizzas.find(p => p.id === id);
            
            // Check if already in cart
            const existingItem = cart.find(item => item.id === id);
            if (existingItem) {
                existingItem.qty += 1;
            } else {
                cart.push({ ...pizza, qty: 1 });
            }

            // Button Micro-interaction
            const originalText = btn.textContent;
            btn.textContent = "Added ✓";
            btn.classList.add('added');
            
            setTimeout(() => {
                btn.textContent = originalText;
                btn.classList.remove('added');
            }, 1200);

            // Cart Icon Bounce
            cartBtn.classList.remove('bounce');
            void cartBtn.offsetWidth; // Trigger reflow to restart animation
            cartBtn.classList.add('bounce');

            updateCart();
        }

        // --- Update Cart UI ---
        function updateCart() {
            // Badge
            const totalQty = cart.reduce((sum, item) => sum + item.qty, 0);
            cartBadge.textContent = totalQty;
            if (totalQty > 0) {
                cartBadge.classList.add('active');
            } else {
                cartBadge.classList.remove('active');
            }

            // Items List
            if (cart.length === 0) {
                cartItemsContainer.innerHTML = `<div class="empty-cart"><p>Your cart is empty.</p><i class="fas fa-pizza-slice" style="font-size: 3rem; margin-top: 20px; color: #ddd;"></i></div>`;
                checkoutBtn.disabled = true;
            } else {
                cartItemsContainer.innerHTML = cart.map(item => `
                    <div class="cart-item">
                        <img src="${item.image}" alt="${item.name}">
                        <div class="item-details">
                            <h4>${item.name} <span style="color:#999; font-size:0.8rem;">(x${item.qty})</span></h4>
                            <span class="item-price">$${(item.price * item.qty).toFixed(2)}</span>
                        </div>
                        <button class="remove-item" data-id="${item.id}"><i class="fas fa-trash"></i></button>
                    </div>
                `).join('');
                
                checkoutBtn.disabled = false;

                // Attach remove listeners
                document.querySelectorAll('.remove-item').forEach(btn => {
                    btn.addEventListener('click', () => removeFromCart(parseInt(btn.getAttribute('data-id'))));
                });
            }

            // Total
            const total = cart.reduce((sum, item) => sum + (item.price * item.qty), 0);
            cartTotal.textContent = `$${total.toFixed(2)}`;
        }

        // --- Remove Item ---
        function removeFromCart(id) {
            cart = cart.filter(item => item.id !== id);
            updateCart();
        }

        // --- Navbar Scroll Effect ---
        window.addEventListener('scroll', () => {
            const navbar = document.getElementById('navbar');
            if (window.scrollY > 50) {
                navbar.classList.add('scrolled');
            } else {
                navbar.classList.remove('scrolled');
            }
        });

        // --- Cart Sidebar Toggle ---
        function openCart() {
            cartSidebar.classList.add('open');
            cartOverlay.classList.add('open');
        }

        function closeCart() {
            cartSidebar.classList.remove('open');
            cartOverlay.classList.remove('open');
        }

        cartBtn.addEventListener('click', openCart);
        closeCartBtn.addEventListener('click', closeCart);
        cartOverlay.addEventListener('click', closeCart);

        // --- Checkout Logic ---
        checkoutBtn.addEventListener('click', () => {
            if (cart.length === 0) return;
            
            // Empty cart
            cart = [];
            updateCart();
            
            // Close sidebar
            closeCart();
            
            // Open Modal
            setTimeout(() => {
                modalOverlay.classList.add('open');
            }, 300); // Small delay to allow sidebar to close first
        });

        closeModalBtn.addEventListener('click', () => {
            modalOverlay.classList.remove('open');
        });

        // Init
        renderPizzas();
        updateCart();
    </script>
</body>
</html>
